<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Jeviro Rapids</title>
  <meta name="description"
    content="Get in touch with Jeviro Rapids Company. Contact us for reservations, inquiries, or feedback about our rafting trips.">
  <meta name="author" content="Jeremiah Victor Robinson">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/white-water-rafting-logo.png" alt="Jeviro Rapids Logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html" class="active">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="company-heading">
      <h1>Jeviro Rapids</h1>
      <p class="address-text">
        121 Ikot Ekpene Road, Uyo, Akwa Ibom State<br>
        <strong>Phone:</strong> +2348136637245<br>
        <strong>Email:</strong> witty4all1@gmail.com
      </p>
    </section>

    <div class="contact-main-grid">
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d63634.68724772682!2d7.568073000000001!3d4.563808949999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1791850145614!5m2!1sen!2sng"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <section class="form-section">
        <form action="#" method="post">
          <div class="form-item">
            <label for="username">Name</label>
            <input type="text" id="username" name="username" placeholder="Placeholder" required>
          </div>

          <div class="form-item">
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" placeholder="Placeholder" required>
          </div>

          <div class="form-item purpose-row">
            <span class="field-label">Message Purpose</span>
            <div class="radio-options">
              <label><input type="radio" name="purpose" value="general" checked> General
                Inquiry</label>
              <label><input type="radio" name="purpose" value="reservation"> Reservation
                Question</label>
              <label><input type="radio" name="purpose" value="suggestion"> Website
                Suggestion</label>
            </div>
          </div>

          <div class="form-item message-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type here..." required></textarea>
          </div>

          <div class="checkbox-item">
            <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
          </div>

          <button type="submit">Get in Touch!</button>
        </form>
      </section>
    </div>

    <section class="team-section">
      <h2>We Are Here to Serve You</h2>
      <div class="team-grid">
        <figure class="profile-card">
          <div class="avatar-placeholder">
            <img src="images/CEO.jpg" alt="Jeremiah Robinson, Lead River Guide">
          </div>
          <figcaption><strong>Jeremiah Robinson</strong><br>Lead River Guide</figcaption>
        </figure>
        <figure class="profile-card">
          <div class="avatar-placeholder">
            <img src="images/staff2.jpg" alt="Michael Obot, Operations Manager">
          </div>
          <figcaption><strong>Michael Obot</strong><br>Operations Manager</figcaption>
        </figure>
        <figure class="profile-card">
          <div class="avatar-placeholder">
            <img src="images/staff3.jpg" alt="Dominic Okon, Safety Inspector">
          </div>
          <figcaption><strong>Dominic Okon</strong><br>Safety Inspector</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 &#10070; Jeviro Rapids &#10070; Jeremiah Robinson</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook-logo.png" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.png" alt="linkedin Icon">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.png" alt="instagram Icon">
      </a>
    </nav>
  </footer>
</body>

</html>
